# ==============================================================================
# BANCO XYZ - CONFIGURACION CENTRALIZADA: BATCH SERVICE (Migracion Legacy)
# ==============================================================================
server.port=8086
spring.application.name=batch-service

# Base de datos H2 en memoria para metadatos Spring Batch
spring.datasource.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=always
spring.batch.job.enabled=false

# Registro en Eureka Discovery Server
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka:eureka2026@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Documentacion OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Metricas y Monitoreo Actuator
management.endpoints.web.exposure.include=health,info,batch
management.endpoint.health.show-details=always

# Logging detallado de ejecuciones batch
logging.level.org.springframework.batch=INFO
logging.level.cl.duoc.bancoxyz.batch=INFO
