server.port=8086
spring.application.name=batch-service

# H2 In-Memory Database para Metadatos de Spring Batch (JobRepository, Steps, Executions)
spring.datasource.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=always
spring.batch.job.enabled=false

# Spring Cloud Config (Opcional si Config Server no responde en test local)
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.uri=http://localhost:8888
spring.cloud.config.fail-fast=false
spring.cloud.config.username=admin
spring.cloud.config.password=gato

# Registro en Eureka Service Discovery
eureka.client.service-url.defaultZone=http://eureka:eureka2026@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info,batch
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework.batch=INFO
logging.level.cl.duoc.bancoxyz.batch=INFO
